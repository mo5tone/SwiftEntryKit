[tools]
swiftformat = "0.63.0"
swiftlint = "0.65.1"
xcbeautify = "3.2.1"
tuist = "4.208.0"

[tasks.lint]
description = "Lint and format-check the codebase (emoji output)"
run = "swiftlint lint --strict --reporter emoji && swiftformat --lint ."

[tasks.format]
description = "Auto-format and auto-fix the codebase"
run = "swiftformat . && swiftlint --fix"
