[tools]
swiftformat = "0.63.0"
swiftlint = "0.65.1"
xcbeautify = "3.2.1"
tuist = "4.208.0"

[tasks.clean]
description = "Remove all git-ignored files and directories"
run = "git clean -fdX"

[tasks.lint]
description = "Lint and format-check the codebase (emoji output)"
run = "swiftlint lint --strict --reporter emoji && swiftformat --lint ."

[tasks.format]
description = "Auto-format and auto-fix the codebase"
run = "swiftformat . && swiftlint --fix"

[tasks.coverage]
description = "Run tests and open an HTML coverage report"
run = """
rm -rf SwiftEntryKit.xcworkspace
xcodebuild test -scheme SwiftEntryKit -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.2' -enableCodeCoverage YES -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO >/dev/null 2>&1
mise run coverage:report
open coverage.html
"""

[tasks."coverage:report"]
description = "Generate an HTML coverage report from TestResults.xcresult"
run = '''
python3 - <<'PY'
import html, json, os, subprocess, sys

RESULT = os.environ.get("COVERAGE_RESULT", "TestResults.xcresult")
OUTPUT = os.environ.get("COVERAGE_OUTPUT", "coverage.html")

def run_xccov(bundle):
    return subprocess.run(["xcrun", "xccov", "view", "--report", "--json", bundle],
                          check=True, capture_output=True, text=True).stdout

def pct(c, e):
    return 0.0 if e == 0 else 100.0 * c / e

def color(r):
    return "#2ecc71" if r >= 80 else ("#f1c40f" if r >= 50 else "#e74c3c")

def short_name(path):
    m = "/Source/SwiftEntryKit/"
    return path.split(m)[-1] if m in path else path

def library_targets(data):
    return [t for t in data.get("targets", []) if not t.get("name", "").endswith("Tests")]

def totals(targets):
    return (sum(t.get("coveredLines", 0) for t in targets),
            sum(t.get("executableLines", 0) for t in targets))

def file_rows(targets):
    rows = []
    for t in targets:
        for f in t.get("files", []):
            c, e = f.get("coveredLines", 0), f.get("executableLines", 0)
            rows.append((pct(c, e), short_name(f.get("path") or f.get("name", "?")), c, e))
    return sorted(rows)

CSS = """
body { font-family: -apple-system, sans-serif; margin: 2rem; color: #222; }
h1 { font-size: 1.4rem; }
.overall { font-size: 2.4rem; font-weight: 700; color: %s; }
table { border-collapse: collapse; width: 100%%; margin-top: 1rem; }
th, td { padding: .4rem .6rem; border-bottom: 1px solid #eee; text-align: left; }
td.name { font-family: ui-monospace, monospace; font-size: .85rem; }
td.num { text-align: right; white-space: nowrap; }
.bar { width: 12rem; height: .6rem; background: #eee; border-radius: .3rem; overflow: hidden; }
.fill { height: 100%%; }
.meta { color: #888; font-size: .8rem; }
"""

def build_html(targets, covered, executable):
    overall = pct(covered, executable)
    body = "".join(
        "<tr><td class='name'>%s</td><td class='num'>%d/%d</td>"
        "<td><div class='bar'><div class='fill' style='width:%.1f%%;background:%s'></div></div></td>"
        "<td class='num'>%.1f%%</td></tr>" % (html.escape(n), c, e, r, color(r), r)
        for r, n, c, e in file_rows(targets)
    )
    return (
        "<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\">"
        "<title>SwiftEntryKit Coverage</title><style>%s</style></head><body>"
        "<h1>SwiftEntryKit — Code Coverage</h1>"
        "<div class=\"overall\">%.1f%%</div>"
        "<div class=\"meta\">%d / %d lines</div>"
        "<table><thead><tr><th>File</th><th>Lines</th><th></th><th>Coverage</th></tr></thead>"
        "<tbody>%s</tbody></table></body></html>"
        % (CSS % color(overall), overall, covered, executable, body)
    )

def build_markdown(targets, covered, executable):
    overall = pct(covered, executable)
    lines = ["## Code Coverage", "", "**%.1f%%** (%d/%d lines)" % (overall, covered, executable), ""]
    lines += ["| Coverage | File | Lines |", "| --- | --- | --- |"]
    for r, n, c, e in file_rows(targets):
        lines.append("| %.1f%% | `%s` | %d/%d |" % (r, n, c, e))
    return "\n".join(lines)

data = json.loads(run_xccov(RESULT))
targets = library_targets(data)
covered, executable = totals(targets)
with open(OUTPUT, "w") as fh:
    fh.write(build_html(targets, covered, executable))
print(build_markdown(targets, covered, executable))
print("Wrote " + OUTPUT, file=sys.stderr)
PY
'''
