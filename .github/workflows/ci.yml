name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    name: Lint & Format
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          cache: true

      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

      - name: SwiftFormat
        run: swiftformat --lint .

  test:
    name: Build & Test (iOS)
    needs: lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          cache: true

      # Run the Swift package tests before generating the Tuist workspace:
      # tuist generate produces a workspace named "SwiftEntryKit" that collides
      # with the package's auto-generated scheme of the same name.
      - name: Test (Swift Package)
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme SwiftEntryKit \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.2' \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO | xcbeautify

      - name: Generate project
        run: tuist generate --no-open

      # Snapshot references are recorded against a fixed simulator OS; keep the
      # destination in sync with the one used in "Test (Swift Package)".
      - name: Build example
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace SwiftEntryKit.xcworkspace \
            -scheme SwiftEntryKitDemo \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.2' \
            CODE_SIGNING_ALLOWED=NO | xcbeautify

      - name: Convert coverage to lcov
        run: |
          xcrun xccov view --report --json TestResults.xcresult > coverage.json
          python3 - > coverage.lcov <<'PY'
          import json, os
          data = json.load(open("coverage.json"))
          root = os.getcwd() + os.sep
          for target in data.get("targets", []):
              for f in target.get("files", []):
                  path = f.get("path") or f.get("name")
                  if path.startswith(root):
                      path = path[len(root):]
                  print(f"SF:{path}")
                  for fn in f.get("functions", []):
                      print(f"DA:{fn.get('lineNumber', 0)},{fn.get('executionCount', 0)}")
                  print(f"LF:{f.get('executableLines', 0)}")
                  print(f"LH:{f.get('coveredLines', 0)}")
                  print("end_of_record")
          PY

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.lcov
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload snapshot artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-artifacts
          path: Tests/**/__Snapshots__/
          if-no-files-found: ignore
