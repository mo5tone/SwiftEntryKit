name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    name: Lint & Format
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          cache: true

      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

      - name: SwiftFormat
        run: swiftformat --lint .

  test:
    name: Build & Test (iOS)
    needs: lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          cache: true

      # Run the Swift package tests before generating the Tuist workspace:
      # tuist generate produces a workspace named "SwiftEntryKit" that collides
      # with the package's auto-generated scheme of the same name.
      - name: Test (Swift Package)
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme SwiftEntryKit \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.2' \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO | xcbeautify

      - name: Generate project
        run: tuist generate --no-open

      # Snapshot references are recorded against a fixed simulator OS; keep the
      # destination in sync with the one used in "Test (Swift Package)".
      - name: Build example
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace SwiftEntryKit.xcworkspace \
            -scheme SwiftEntryKitDemo \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.2' \
            CODE_SIGNING_ALLOWED=NO | xcbeautify

      - name: Generate coverage report
        run: |
          python3 Scripts/generate-coverage-report.py TestResults.xcresult coverage.html > coverage-summary.md
          cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
          overall=$(sed -n '3p' coverage-summary.md | tr -d '*')
          echo "::notice title=Code Coverage::$overall"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.html
          if-no-files-found: error

      - name: Upload snapshot artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-artifacts
          path: Tests/**/__Snapshots__/
          if-no-files-found: ignore
