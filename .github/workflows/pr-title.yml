name: PR Title

on:
  pull_request_target:
    branches: [master]
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: PR Title
    runs-on: ubuntu-latest
    steps:
      # pull_request_target so PRs from forks are validated too. The action only
      # reads the PR title from the event payload; it does not check out code.
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
